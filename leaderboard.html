<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liderlik Tablosu | Hedef100 Academia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; background-color: #020617; color: #f8fafc; }
        .bg-grid-pattern { background-image: radial-gradient(rgba(249, 115, 22, 0.15) 1px, transparent 1px); background-size: 30px 30px; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text { text-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .podium-1 { transform: scale(1.1); z-index: 10; border-color: #fbbf24; box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); }
        .podium-2 { transform: translateY(20px); z-index: 9; border-color: #94a3b8; }
        .podium-3 { transform: translateY(40px); z-index: 8; border-color: #d97706; }
    </style>
</head>
<body class="h-screen flex flex-col relative bg-slate-950 overflow-hidden">
    <!-- ARKA PLAN -->
    <div class="fixed inset-0 w-full h-full bg-grid-pattern opacity-40 pointer-events-none z-0"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-orange-500/5 via-transparent to-transparent pointer-events-none z-0"></div>
    <!-- HEADER -->
    <header class="bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40 border-b border-slate-800 px-6 py-4 flex justify-between items-center relative">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 text-white rounded-lg flex items-center justify-center font-black shadow-lg shadow-orange-500/30">H</div>
            <span class="font-black text-sm md:text-base tracking-tighter text-white">HEDEF100<span class="text-orange-500">.ŞAMPİYONLAR</span></span>
        </div>
        <a href="student-dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition-all uppercase tracking-wider border border-slate-700">Panele Dön</a>
    </header>
    <main class="flex-1 overflow-y-auto relative z-10 p-4 md:p-8 w-full max-w-6xl mx-auto flex flex-col h-full">
        <div class="text-center mb-10 mt-4">
            <span class="px-3 py-1 bg-orange-500/10 border border-orange-500/20 text-orange-400 text-[10px] font-black uppercase tracking-widest rounded-lg mb-4 inline-block">Kurumsal Deneme ve Etüt Sıralaması</span>
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight leading-tight">Kurum <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-yellow-300">Liderlik Tablosu</span></h1>
            <p class="text-slate-400 text-sm mt-3">Odak odasında geçirdiğin süre ve tamamladığın görevlerle zirveye tırman.</p>
        </div>
        <!-- PODIUM (İLK 3) -->
        <div class="flex justify-center items-end gap-2 md:gap-6 mb-12 h-64" id="podiumContainer">
            <div class="w-full text-center text-slate-500 text-xs font-bold animate-pulse">Liderler Yükleniyor...</div>
        </div>
        <!-- DİĞER SIRALAMALAR (4 VE SONRASI) -->
        <div class="glass-card rounded-3xl p-6 md:p-8 flex-1 flex flex-col border border-slate-800 shadow-2xl overflow-hidden">
            <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-4 border-b border-slate-800 pb-3">Tüm Sıralama</h3>
            <div class="flex-1 overflow-y-auto space-y-3 pr-2" id="leaderboardList">
                <!-- JS ile Doldurulacak -->
            </div>
        </div>
    </main>
    <!-- Firebase SDK'ları -->
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, query, where, orderBy, limit, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { auth, db } from "./firebase-shared.js";
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const kurumId = userData.kurumId;
                    if(kurumId) {
                        fetchLeaderboard(kurumId);
                    } else {
                        document.getElementById('podiumContainer').innerHTML = `<p class="text-rose-400 font-bold">Herhangi bir kuruma bağlı değilsiniz.</p>`;
                    }
                }
            } else {
                window.location.href = 'login.html';
            }
        });
        async function fetchLeaderboard(kurumId) {
            try {
                const q = query(
                    collection(db, "users"),
                    where("role", "==", "student"),
                    where("kurumId", "==", kurumId),
                    orderBy("xp", "desc"),
                    limit(50)
                );
                const querySnapshot = await getDocs(q);
                
                // --- BOT ÖĞRENCİLER (Gerçekçi ve Sabit) ---
                const botStudents = [
                    { id: "bot1", firstName: "Zeynep", lastName: "K.", xp: 1450, hedefId: "H100-ZYNP" },
                    { id: "bot2", firstName: "Caner", lastName: "Y.", xp: 1200, hedefId: "H100-CANR" },
                    { id: "bot3", firstName: "Ayşe", lastName: "T.", xp: 850, hedefId: "H100-AYSE" },
                    { id: "bot4", firstName: "Mehmet", lastName: "E.", xp: 420, hedefId: "H100-MHMT" },
                    { id: "bot5", firstName: "Elif", lastName: "S.", xp: 210, hedefId: "H100-ELIF" }
                ];
                
                const students = [...botStudents];
                querySnapshot.forEach((doc) => {
                    students.push({ id: doc.id, ...doc.data() });
                });
                // Botları ve gerçek öğrencileri birleştirip en yüksek XP'den en düşüğe sırala
                students.sort((a, b) => (b.xp || 0) - (a.xp || 0));
                renderLeaderboard(students);
            } catch (error) {
                console.error("Liderlik tablosu hatası:", error);
                document.getElementById('podiumContainer').innerHTML = `<p class="text-rose-400 font-bold text-xs mt-10">Sıralama yüklenemedi. Veritabanı Index oluşturma işlemi gerekiyor olabilir. F12 konsolunu kontrol edin.</p>`;
            }
        }
        function renderLeaderboard(students) {
            const podium = document.getElementById('podiumContainer');
            const list = document.getElementById('leaderboardList');
            
            podium.innerHTML = '';
            list.innerHTML = '';
            if (students.length === 0) {
                podium.innerHTML = `<p class="text-slate-500 font-bold mt-10">Henüz XP kazanan kimse yok.</p>`;
                return;
            }
            const top3 = students.slice(0, 3);
            let podiumHTML = "";
            
            if(top3.length > 1) {
                podiumHTML += `
                <div class="glass-card podium-2 w-28 md:w-36 rounded-[2rem] p-4 flex flex-col items-center border-t-4 bg-slate-900/80">
                    <div class="w-12 h-12 bg-slate-400 text-white rounded-full flex items-center justify-center font-black text-lg shadow-lg mb-3">2</div>
                    <p class="font-bold text-white text-xs md:text-sm truncate w-full text-center">${top3[1].firstName}</p>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">${top3[1].xp || 0} XP</p>
                </div>`;
            }
            if(top3.length > 0) {
                podiumHTML += `
                <div class="glass-card podium-1 w-32 md:w-44 rounded-[2rem] p-5 flex flex-col items-center border-t-4 bg-orange-500/10">
                    <div class="w-16 h-16 bg-gradient-to-br from-yellow-400 to-orange-500 text-white rounded-full flex items-center justify-center font-black text-2xl shadow-xl shadow-orange-500/30 mb-3 border-2 border-yellow-200">👑</div>
                    <p class="font-black text-white text-sm md:text-base truncate w-full text-center neon-text">${top3[0].firstName}</p>
                    <p class="text-[11px] text-orange-400 uppercase tracking-widest font-black mt-1">${top3[0].xp || 0} XP</p>
                </div>`;
            }
            if(top3.length > 2) {
                podiumHTML += `
                <div class="glass-card podium-3 w-28 md:w-36 rounded-[2rem] p-4 flex flex-col items-center border-t-4 bg-slate-900/80">
                    <div class="w-12 h-12 bg-amber-700 text-white rounded-full flex items-center justify-center font-black text-lg shadow-lg mb-3">3</div>
                    <p class="font-bold text-white text-xs md:text-sm truncate w-full text-center">${top3[2].firstName}</p>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">${top3[2].xp || 0} XP</p>
                </div>`;
            }
            
            podium.innerHTML = podiumHTML;
            const others = students.slice(3);
            if(others.length === 0) {
                list.innerHTML = `<div class="text-center p-4 text-xs font-bold text-slate-600">Başka öğrenci bulunmuyor.</div>`;
            }
            others.forEach((s, index) => {
                const rank = index + 4;
                list.innerHTML += `
                <div class="flex items-center justify-between p-4 bg-slate-900/40 rounded-2xl border border-slate-800 hover:bg-slate-800/60 transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 font-black flex items-center justify-center text-xs border border-slate-700">${rank}</div>
                        <div>
                            <p class="font-bold text-white text-sm">${s.firstName} ${s.lastName}</p>
                            <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold">${s.hedefId || 'ID Yok'}</p>
                        </div>
                    </div>
                    <div class="px-3 py-1 bg-indigo-500/10 text-indigo-400 text-xs font-black uppercase tracking-widest rounded-lg border border-indigo-500/20">
                        ${s.xp || 0} XP
                    </div>
                </div>
                `;
            });
        }
    </script>
</body>
</html>
